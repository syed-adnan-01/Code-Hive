<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Glowing Background Filter -->
  <defs>
    <linearGradient id="hiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Honeycomb -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
           fill="#0d1017" 
           stroke="url(#hiveGrad)" 
           stroke-width="3.5" 
           stroke-linejoin="round" />

  <!-- Inner Cyber Grid Accent -->
  <polygon points="32,10 52,21.5 52,42.5 32,54 12,42.5 12,21.5" 
           fill="rgba(99, 102, 241, 0.12)" 
           stroke="rgba(245, 158, 11, 0.3)" 
           stroke-width="1.2" 
           stroke-dasharray="3 3" />

  <!-- Code Brackets < / > with vibrant gradient -->
  <!-- Left Bracket < -->
  <path d="M25 24 L17 32 L25 40" 
        stroke="url(#hiveGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Slash / -->
  <path d="M35 22 L29 42" 
        stroke="url(#innerGlow)" 
        stroke-width="3" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Right Bracket > -->
  <path d="M39 24 L47 32 L39 40" 
        stroke="url(#hiveGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Glowing Honeycomb Center Node -->
  <circle cx="32" cy="18" r="2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="32" cy="46" r="2" fill="#f59e0b" filter="url(#glow)" />
</svg>